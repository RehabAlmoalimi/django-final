<!-- firstapp/templates/dashboard/create_category.html -->
{% extends 'dashboard/base.html' %}
{% load static %}

{% block content %}
<main class="content">
    <form method="POST">
        {% csrf_token %}
        <div class="container-fluid p-0">

            <div class="mb-3">
                <h1 class="h3 d-inline align-middle">
                    {% if form.instance.pk %}Update{% else %}Create{% endif %} Category
                </h1>
            </div>

            <div class="row">
                <div class="col-12 col-lg-6">

                    <!-- Name field -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Category Name</h5>
                        </div>
                        <div class="card-body">
                            <input type="text" name="name" value="{{ form.name.value }}" class="form-control">
                        </div>
                    </div>

                    <!-- Description field -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Description</h5>
                        </div>
                        <div class="card-body">
                            <textarea name="description" class="form-control">{{ form.description.value }}</textarea>
                        </div>
                    </div>

                    <!-- Submit button -->
                    <div class="card">
                        <div class="card-body">
                            <button type="submit" class="btn btn-primary">
                                {% if form.instance.pk %}Update{% else %}Create{% endif %}
                            </button>
                            <a href="{% url 'list_category' %}" class="btn btn-secondary">Back to Categories List</a>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </form>
</main>
{% endblock content %}
