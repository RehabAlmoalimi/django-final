<!-- firstapp/templates/dashboard/list_category.html -->
{% extends 'dashboard/base.html' %}
{% load static %}

{% block content %}
<main class="content">
    <div class="row">
        <div class="card flex-fill">
            <div class="card-header">
                <h5 class="card-title mb-0">Categories</h5>
            </div>
            <table class="table table-hover my-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th class="d-none d-xl-table-cell">Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for category in categories %}
                    <tr>
                        <td>{{ category.id }}</td>
                        <td>{{ category.name }}</td>
                        <td class="d-none d-xl-table-cell">{{ category.description }}</td>
                        <td>
                            <a href="{% url 'update_category' category.id %}" class="badge bg-success">Edit</a>
                            <a href="{% url 'delete_category' category.id %}" class="badge bg-danger">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center">No categories found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</main>
{% endblock content %}
