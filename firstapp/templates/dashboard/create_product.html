{% extends 'dashboard/base.html' %}
{% load static %}
{% block content %}

<main class="content">
    <h1 class="h3 mb-3">
        {% if form.instance.pk %}Edit{% else %}Add{% endif %} Product
    </h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label>Product Name</label>
            {{ form.name }}
        </div>

        <div class="mb-3">
            <label>Description</label>
            {{ form.description }}
        </div>

        <div class="mb-3">
            <label>Category</label>
            {{ form.category }}
        </div>

        <div class="mb-3">
            <label>Price</label>
            {{ form.price }}
        </div>

        <div class="mb-3">
            <label>Image</label>
            {{ form.image }}
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'list_product' %}" class="btn btn-secondary">Back</a>
    </form>
</main>

{% endblock content %}
